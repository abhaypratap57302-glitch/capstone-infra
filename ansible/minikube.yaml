---
- name: Prepare the Minikube node
  hosts: minikube
  become: true
  tasks:
    - name: Refresh the package list
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Install Java and Docker
      ansible.builtin.apt:
        name:
          - openjdk-21-jre-headless
          - docker.io
        state: present

    - name: Start Docker and keep it starting at boot
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

    - name: Let the ubuntu user run Docker without sudo
      ansible.builtin.user:
        name: ubuntu
        groups: docker
        append: true

    - name: Find the latest stable kubectl version
      ansible.builtin.uri:
        url: https://dl.k8s.io/release/stable.txt
        return_content: true
      register: kubectl_version

    - name: Install kubectl
      ansible.builtin.get_url:
        url: "https://dl.k8s.io/release/{{ kubectl_version.content | trim }}/bin/linux/amd64/kubectl"
        dest: /usr/local/bin/kubectl
        mode: "0755"

    - name: Install Minikube
      ansible.builtin.get_url:
        url: https://storage.googleapis.com/minikube/releases/latest/minikube-linux-amd64
        dest: /usr/local/bin/minikube
        mode: "0755"
